name: Bug report
description: Report a problem with the dashboard UI or behaviour
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For anything
        security-sensitive, please use the **Security → Report a vulnerability**
        channel instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. Chrome 141 / Windows 11, portad.vishmuka.in"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / clip
      description: Drag and drop any images here if applicable.
