name: Feature request
description: Suggest an improvement or a new dashboard capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do that the dashboard doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Any UI sketches help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Homepage / marketing
        - Migration wizard
        - Jobs
        - Compatibility matrix
        - Account / auth
        - Accessibility
        - Other
    validations:
      required: true
